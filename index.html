<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">Chutis ♡</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --color-brown: #91766E;
      --color-brown-dark: #6e554d;
      --color-vanilla: #EFD8D6;
      --color-vanilla-soft: #f7ebe9;
      --color-fantasy: #F7F3ED;
      --card-bg: rgba(255, 255, 255, 0.94);
      --border-soft: rgba(145, 118, 110, 0.25);
      --border-dashed: #d4c4bf;
      --text-dark: #4a3b37;
      --text-muted: #8c7872;
      --shadow: 0 10px 25px rgba(145, 118, 110, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #ffffff 0%, var(--color-fantasy) 60%, #eae3db 100%);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .sakura-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .sakura-petal {
      position: absolute;
      top: -30px;
      width: 14px;
      height: 18px;
      background: linear-gradient(135deg, #ffffff 0%, #ffc5d3 50%, #f7a8b8 100%);
      border-radius: 12px 2px 12px 2px;
      opacity: 0.85;
      filter: drop-shadow(0 2px 5px rgba(239, 216, 214, 0.7));
      animation: sakuraFall linear infinite;
    }

    @keyframes sakuraFall {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% {
        transform: translateY(115vh) rotate(360deg) scale(1.1);
        opacity: 0;
      }
    }

    .click-petal {
      position: fixed;
      pointer-events: none;
      z-index: 999999;
      width: 15px;
      height: 20px;
      background: linear-gradient(135deg, #ffffff 10%, #ffb6c7 60%, #e88d9f 100%);
      border-radius: 12px 2px 12px 2px;
      box-shadow: 0 2px 8px rgba(247, 168, 184, 0.6);
      animation: burstPetal 0.9s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    @keyframes burstPetal {
      0% {
        transform: translate(0, 0) scale(0.6) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(var(--rot));
        opacity: 0;
      }
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 14px 80px;
      position: relative;
      z-index: 2;
    }

    .top-nav {
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 28px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .nav-tabs {
      display: flex;
      gap: 4px;
      flex: 1;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 20px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--color-brown);
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(145, 118, 110, 0.15);
      border: 1px solid var(--border-soft);
    }

    .music-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffffff;
      border: 1.5px solid var(--border-soft);
      color: var(--color-brown);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-left: 6px;
      flex-shrink: 0;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: tabFade 0.25s ease; }

    @keyframes tabFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .banner-box {
      width: 100%;
      height: 155px;
      border-radius: 24px;
      overflow: hidden;
      border: 1.5px solid #fff;
      background: var(--color-vanilla);
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }
    .banner-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .profile-wrap {
      display: flex;
      justify-content: center;
      margin-top: -65px;
      margin-bottom: 8px;
    }

    .profile-container {
      position: relative;
      width: 86px;
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-circle {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3.5px solid #ffffff;
      box-shadow: 0 6px 18px rgba(145, 118, 110, 0.2);
    }
    .profile-circle img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .profile-frame {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 122px;
      height: auto;
      pointer-events: none;
      z-index: 3;
      object-fit: contain;
    }

    .store-title {
      font-size: 21px;
      font-weight: 700;
      color: var(--color-brown);
      margin-top: 6px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .bio-dashed-box {
      background: #ffffff;
      border: 1.5px dashed var(--border-dashed);
      border-radius: 22px;
      padding: 16px 14px;
      margin-top: 14px;
      text-align: center;
      line-height: 1.7;
      font-size: 13.5px;
      color: var(--text-dark);
      white-space: pre-line;
      box-shadow: 0 4px 14px rgba(0,0,0,0.02);
    }

    .section-label {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--color-brown);
      margin: 22px 0 12px 2px;
      display: flex;
      align-items: center;
    }

    .highlights-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .highlights-row::-webkit-scrollbar { display: none; }

    .hl-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .hl-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, var(--color-brown), var(--color-vanilla));
      box-shadow: 0 4px 12px rgba(145, 118, 110, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hl-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      background: #ffffff;
    }

    .hl-label {
      font-size: 11.5px;
      color: var(--text-muted);
      max-width: 72px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      font-weight: 600;
    }

    .review-form-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 24px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .clean-input {
      width: 100%;
      border: 1.5px solid var(--border-soft);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text-dark);
      outline: none;
      background: #ffffff;
      margin-bottom: 12px;
    }
    .clean-input:focus, .clean-textarea:focus { border-color: var(--color-brown); }

    .stars-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .star-btn {
      background: none;
      border: none;
      font-size: 26px;
      color: #ded6d3;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .star-btn.active {
      color: var(--color-brown);
      transform: scale(1.15);
      filter: drop-shadow(0 2px 6px rgba(145, 118, 110, 0.3));
    }

    .clean-textarea {
      width: 100%;
      border: 1.5px solid var(--border-soft);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text-dark);
      outline: none;
      background: #ffffff;
      min-height: 80px;
      resize: vertical;
      margin-bottom: 16px;
    }

    .pill-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--color-brown), var(--color-brown-dark));
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(145, 118, 110, 0.25);
    }

    .review-bubble {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.02);
      margin-bottom: 10px;
    }
    .review-bubble-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .review-cust-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--color-brown);
    }
    .review-stars-display {
      color: var(--color-brown);
      font-size: 13px;
      letter-spacing: 2px;
    }
    .review-cust-msg {
      font-size: 12.5px;
      color: var(--text-dark);
      line-height: 1.55;
      white-space: pre-line;
    }

    .details-white-card {
      background: #ffffff;
      border: 1.5px solid var(--border-soft);
      border-radius: 22px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      line-height: 1.8;
      font-size: 13.5px;
      color: var(--text-dark);
      white-space: pre-line;
      margin-bottom: 14px;
    }

    .contact-card-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    .contact-bubble-link {
      background: #ffffff;
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-dark);
      box-shadow: var(--shadow);
      transition: transform 0.15s;
    }
    .contact-bubble-link:active { transform: scale(0.98); }

    .contact-bubble-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .contact-circle-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--color-vanilla-soft);
      border: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--color-brown);
    }

    .story-modal {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 9999999;
      display: none;
      flex-direction: column;
      justify-content: space-between;
    }
    .story-modal.show { display: flex; }

    .story-bars {
      display: flex;
      gap: 4px;
      padding: 12px 14px 6px;
      z-index: 10;
    }

    .story-bar {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      overflow: hidden;
    }

    .story-bar-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      transition: width 0.1s linear;
    }

    .story-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px;
      z-index: 10;
      color: #fff;
    }

    .story-body {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .story-body img {
      width: 100%;
      height: 100%;
      max-height: 92vh;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .story-nav-btn {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 99999;
      cursor: pointer;
    }
    .story-nav-left { left: 0; }
    .story-nav-right { right: 0; }
  </style>
</head>
<body>

  <div class="sakura-layer" id="sakuraLayer"></div>
  <audio id="bgMusic" loop preload="auto" src="https://files.catbox.moe/dm8ddi.mp3"></audio>

  <div class="container">

    <div class="top-nav">
      <div class="nav-tabs">
        <button type="button" class="tab-btn active" onclick="switchNavTab('home')">home</button>
        <button type="button" class="tab-btn" onclick="switchNavTab('credit')">credit</button>
        <button type="button" class="tab-btn" onclick="switchNavTab('details')">details</button>
        <button type="button" class="tab-btn" onclick="switchNavTab('contact')">contact</button>
      </div>
      <button type="button" class="music-btn" onclick="toggleAudio()">🎵</button>
    </div>

    <!-- 1. Home -->
    <div class="tab-content active" id="tab-home">
      <div class="banner-box">
        <img id="mainBanner" src="https://files.catbox.moe/qqpvr2.jpeg" alt="Banner">
      </div>

      <div class="profile-wrap">
        <div class="profile-container">
          <div class="profile-circle">
            <img id="mainProfile" src="https://files.catbox.moe/hyk7hs.jpeg" alt="Profile">
          </div>
          <img class="profile-frame" id="mainFrame" src="https://files.catbox.moe/41rka4.png" alt="Profile Frame">
        </div>
      </div>

      <h1 class="store-title" id="storeNameText">Chutis</h1>

      <div class="bio-dashed-box" id="bioBoxText">
ยินดีต้อนรับสู่ร้าน Chutis ♡
ติดต่อด่วนที่ ไลน์ @094rchoe
      </div>

      <!-- ลบอีโมจิซากุระออกแล้ว -->
      <div class="section-label">
        <span id="hlSectionTitle">Highlights</span>
      </div>

      <div class="highlights-row" id="highlightsBar"></div>
    </div>

    <!-- 2. Credit (รีวิว) -->
    <div class="tab-content" id="tab-credit">
      <div class="review-form-card">
        <div style="font-weight:700; color:var(--color-brown); font-size:15.5px; margin-bottom:12px;" id="reviewCardTitle">review chutis</div>
        <input type="text" id="custNameInput" class="clean-input" placeholder="ชื่อหรือนามแฝง">
        
        <div class="stars-selector">
          <button type="button" class="star-btn active" onclick="selectStar(1)">★</button>
          <button type="button" class="star-btn active" onclick="selectStar(2)">★</button>
          <button type="button" class="star-btn active" onclick="selectStar(3)">★</button>
          <button type="button" class="star-btn active" onclick="selectStar(4)">★</button>
          <button type="button" class="star-btn active" onclick="selectStar(5)">★</button>
        </div>

        <textarea id="custMsgInput" class="clean-textarea" placeholder="give me a review."></textarea>
        <button type="button" class="pill-btn" id="sendReviewBtn" onclick="submitReview()">sent review ♡</button>
      </div>

      <div class="section-label">
        <span>♡ รีวิวทั้งหมด</span>
      </div>
      <div id="feedbackFeed"></div>
    </div>

    <!-- 3. Details -->
    <div class="tab-content" id="tab-details">
      <div class="details-white-card">
        <div style="font-weight:700; color:var(--color-brown); margin-bottom:8px; font-size:15px;" id="detailsTitle">รายละเอียดร้าน Chutis</div>
        <div id="detailsContentText">
ยินดีต้อนรับสู่ร้าน Chutis ♡
สามารถติดต่อสอบถาม หรืออ่านเงื่อนไขบริการต่างๆ ได้เลยนะคะ
        </div>
      </div>
    </div>

    <!-- 4. Contact -->
    <div class="tab-content" id="tab-contact">
      <div class="bio-dashed-box" style="margin-top:0;" id="contactDescText">
ติดต่อด่วนที่ ไลน์ @094rchoe
      </div>

      <!-- ช่องทางติดต่อเพิ่ม/ลบอัตโนมัติตามแอดมิน -->
      <div class="contact-card-box" id="contactLinksContainer"></div>
    </div>

  </div>

  <div class="story-modal" id="storyModal">
    <div class="story-bars" id="storyBars"></div>
    <div class="story-header">
      <span id="storyTitleText" style="font-weight:600; font-size:14px;">Highlight</span>
      <button style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;" onclick="closeStoryModal()">✕</button>
    </div>
    <div class="story-body">
      <div class="story-nav-btn story-nav-left" id="storyNavLeft"></div>
      <img id="storyActiveImg" src="" alt="Story" draggable="false">
      <div class="story-nav-btn story-nav-right" id="storyNavRight"></div>
    </div>
  </div>

  <script>
    const DB_CONFIG = "chutis_config";
    const DB_HL = "chutis_highlights";
    const DB_REVIEWS = "chutis_reviews";

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const audio = document.getElementById('bgMusic');
    let audioContext;
    function unlockAudio() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      if (audio.paused && audio.src) audio.play().catch(() => {});
    }
    window.addEventListener('load', unlockAudio);
    ['touchstart', 'touchend', 'click', 'pointerdown'].forEach(e => {
      document.addEventListener(e, function run() {
        unlockAudio();
        document.removeEventListener(e, run);
      }, { passive: true });
    });

    function toggleAudio() {
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    }

    function switchNavTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    let highlightsData = [];

    function applyData(d) {
      if (!d) return;
      if (d.siteTitle) document.getElementById('pageTitle').textContent = d.siteTitle;
      if (d.storeName) document.getElementById('storeNameText').textContent = d.storeName;
      if (d.storeBio) document.getElementById('bioBoxText').textContent = d.storeBio;
      if (d.bannerImg) document.getElementById('mainBanner').src = d.bannerImg;
      if (d.profileImg) document.getElementById('mainProfile').src = d.profileImg;
      if (d.profileFrame) document.getElementById('mainFrame').src = d.profileFrame;
      if (d.hlSectionTitle) document.getElementById('hlSectionTitle').textContent = d.hlSectionTitle;
      if (d.reviewCardTitle) document.getElementById('reviewCardTitle').textContent = d.reviewCardTitle;
      if (d.contactDesc) document.getElementById('contactDescText').textContent = d.contactDesc;
      if (d.details) document.getElementById('detailsContentText').textContent = d.details;
      
      // แสดงรายชื่อ Contact ตามที่แอดมินตั้ง
      renderContacts(d.contacts || [
        { title: "Twitter", handle: "@chullmy", url: "https://x.com/chullmy" },
        { title: "Line official", handle: "@094rchoe", url: "https://lin.ee/XnaKBCX" }
      ]);

      if (d.musicUrl && audio.src !== d.musicUrl) {
        audio.src = d.musicUrl;
        unlockAudio();
      }
    }

    function renderContacts(list) {
      const box = document.getElementById('contactLinksContainer');
      box.innerHTML = '';
      if (!list || !list.length) {
        box.innerHTML = '<p style="text-align:center; font-size:12px; color:var(--text-muted); padding:10px;">ยังไม่มีช่องทางติดต่อ</p>';
        return;
      }
      list.forEach(c => {
        if (!c.url) return;
        const a = document.createElement('a');
        a.href = c.url;
        a.target = '_blank';
        a.className = 'contact-bubble-link';
        a.innerHTML = `
          <div class="contact-bubble-left">
            <div class="contact-circle-icon">💬</div>
            <div>
              <div style="font-weight:700; font-size:14px;">${c.title || 'ติดต่อ'}</div>
              <div style="font-size:12px; color:var(--text-muted);">${c.handle || ''}</div>
            </div>
          </div>
          <span style="color:var(--color-brown); font-size:14px; font-weight:700;">→</span>
        `;
        box.appendChild(a);
      });
    }

    db.collection(DB_CONFIG).doc("main").onSnapshot(doc => {
      if (doc.exists) applyData(doc.data());
    });

    db.collection(DB_HL).orderBy("order", "asc").onSnapshot(snap => {
      highlightsData = [];
      snap.forEach(doc => highlightsData.push(doc.data()));
      renderHighlights(highlightsData);
    });

    function renderHighlights(hl) {
      const bar = document.getElementById('highlightsBar');
      bar.innerHTML = '';
      if (!hl || hl.length === 0) {
        bar.innerHTML = '<span style="font-size:12px; color:var(--text-muted); padding:4px;">ยังไม่มีไฮไลท์</span>';
        return;
      }
      hl.forEach((item, idx) => {
        const cover = item.cover || (item.images && item.images[0]) || "";
        const div = document.createElement('div');
        div.className = 'hl-item';
        div.onclick = () => openStory(idx);
        div.innerHTML = `
          <div class="hl-ring"><img src="${cover}" alt="HL"></div>
          <div class="hl-label">${item.title || 'Highlight'}</div>
        `;
        bar.appendChild(div);
      });
    }

    let activeHlIdx = 0;
    let activeSlideIdx = 0;
    let slideTimer = null;

    function openStory(idx) {
      activeHlIdx = idx;
      activeSlideIdx = 0;
      const hl = highlightsData[idx];
      if (!hl || !hl.images || !hl.images.length) {
        alert("ไฮไลท์นี้ยังไม่มีรูปภาพค่ะ ♡");
        return;
      }
      document.getElementById('storyTitleText').textContent = hl.title || 'Highlight';
      buildStoryBars();
      showStorySlide();
      document.getElementById('storyModal').classList.add('show');
    }

    function buildStoryBars() {
      const hl = highlightsData[activeHlIdx];
      const bars = document.getElementById('storyBars');
      bars.innerHTML = '';
      hl.images.forEach((_, i) => {
        const bar = document.createElement('div');
        bar.className = 'story-bar';
        bar.innerHTML = `<div class="story-bar-fill" id="sb-${i}"></div>`;
        bars.appendChild(bar);
      });
    }

    function showStorySlide() {
      clearTimeout(slideTimer);
      const hl = highlightsData[activeHlIdx];
      document.getElementById('storyActiveImg').src = hl.images[activeSlideIdx];

      hl.images.forEach((_, i) => {
        const fill = document.getElementById(`sb-${i}`);
        if (!fill) return;
        if (i < activeSlideIdx) fill.style.width = '100%';
        else if (i === activeSlideIdx) {
          fill.style.width = '0%';
          setTimeout(() => { fill.style.width = '100%'; }, 50);
        } else fill.style.width = '0%';
      });

      slideTimer = setTimeout(nextStorySlide, 5000);
    }

    function nextStorySlide() {
      clearTimeout(slideTimer);
      const hl = highlightsData[activeHlIdx];
      if (activeSlideIdx < hl.images.length - 1) {
        activeSlideIdx++;
        showStorySlide();
      } else {
        closeStoryModal();
      }
    }

    function prevStorySlide() {
      clearTimeout(slideTimer);
      if (activeSlideIdx > 0) {
        activeSlideIdx--;
        showStorySlide();
      }
    }

    function closeStoryModal() {
      clearTimeout(slideTimer);
      document.getElementById('storyModal').classList.remove('show');
    }

    function bindTap(el, cb) {
      if (!el) return;
      let sx = 0, sy = 0, st = 0;
      el.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = Date.now(); }, { passive: true });
      el.addEventListener('pointerup', e => {
        if (Math.abs(e.clientX - sx) < 15 && Math.abs(e.clientY - sy) < 15 && (Date.now() - st) < 450) {
          e.preventDefault();
          cb();
        }
      });
    }
    bindTap(document.getElementById('storyNavRight'), nextStorySlide);
    bindTap(document.getElementById('storyNavLeft'), prevStorySlide);

    let currentRating = 5;
    function selectStar(num) {
      currentRating = num;
      document.querySelectorAll('.star-btn').forEach((b, i) => {
        if (i < num) b.classList.add('active');
        else b.classList.remove('active');
      });
    }

    async function submitReview() {
      const name = document.getElementById('custNameInput').value.trim();
      const msg = document.getElementById('custMsgInput').value.trim();
      const btn = document.getElementById('sendReviewBtn');
      if (!name || !msg) {
        alert("กรุณากรอกชื่อหรือนามแฝง และข้อความรีวิวด้วยนะคะ ♡");
        return;
      }
      btn.disabled = true;
      try {
        await db.collection(DB_REVIEWS).add({
          name: name,
          msg: msg,
          stars: currentRating,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('custNameInput').value = '';
        document.getElementById('custMsgInput').value = '';
        selectStar(5);
        alert("ขอบคุณสำหรับรีวิวร้าน Chutis นะคะ ♡");
      } catch (e) {
        alert("เกิดข้อผิดพลาดในการส่งรีวิว");
      } finally {
        btn.disabled = false;
      }
    }

    db.collection(DB_REVIEWS).orderBy("createdAt", "desc").onSnapshot(snap => {
      const box = document.getElementById('feedbackFeed');
      box.innerHTML = '';
      if (snap.empty) {
        box.innerHTML = '<p style="text-align:center; font-size:12px; color:var(--text-muted); padding:10px;">ยังไม่มีรีวิว มารีวิวเป็นคนแรกได้เลยนะคะ ♡</p>';
        return;
      }
      snap.forEach(doc => {
        const d = doc.data();
        const div = document.createElement('div');
        div.className = 'review-bubble';
        div.innerHTML = `
          <div class="review-bubble-head">
            <span class="review-cust-name">${d.name}</span>
            <span class="review-stars-display">${'★'.repeat(d.stars || 5)}</span>
          </div>
          <div class="review-cust-msg">${d.msg}</div>
        `;
        box.appendChild(div);
      });
    });

    const sakuraContainer = document.getElementById('sakuraLayer');
    setInterval(() => {
      const petal = document.createElement('div');
      petal.className = 'sakura-petal';
      petal.style.left = (Math.random() * 95) + 'vw';
      petal.style.animationDuration = (7 + Math.random() * 6) + 's';
      petal.style.width = (11 + Math.random() * 7) + 'px';
      petal.style.height = (15 + Math.random() * 8) + 'px';
      sakuraContainer.appendChild(petal);
      setTimeout(() => petal.remove(), 14000);
    }, 900);

    window.addEventListener('pointerdown', (e) => {
      const count = 4 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'click-petal';
        p.style.left = (e.clientX - 8) + 'px';
        p.style.top = (e.clientY - 10) + 'px';
        
        const angle = Math.random() * Math.PI * 2;
        const dist = 30 + Math.random() * 50;
        const dx = Math.cos(angle) * dist + 'px';
        const dy = Math.sin(angle) * dist - 25 + 'px';
        const rot = (Math.random() * 360 - 180) + 'deg';
        
        p.style.setProperty('--dx', dx);
        p.style.setProperty('--dy', dy);
        p.style.setProperty('--rot', rot);
        
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 900);
      }
    }, { passive: true });
  </script>
</body>
</html>
